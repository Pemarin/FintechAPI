name: 🚀 FintechBlock — Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

# ─────────────────────────────────────────────────────────────
# JOB 1 Lint & Análise Estática (Backend Python)
# ─────────────────────────────────────────────────────────────
jobs:
  lint-backend:
    name: 🔍 Lint — Backend Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: blockchain/backend/requirements*.txt

      - name: Instalar dependências de lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff — Linter rápido
        run: ruff check blockchain/backend/app --output-format=github

      - name: Ruff — Formatação
        run: ruff format blockchain/backend/app

      - name: MyPy — Verificação de tipos
        working-directory: blockchain/backend
        run: |
          pip install -r requirements.txt
          mypy app --ignore-missing-imports --exclude '__pycache__'

  # ─────────────────────────────────────────────────────────────
  # JOB 2 Testes Unitários e de Integração (Backend PyTest)
  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Testes — Backend PyTest
    runs-on: ubuntu-latest
    needs: lint-backend
    permissions:        
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: blockchain/backend/requirements*.txt

      - name: Instalar dependências
        working-directory: blockchain/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Executar PyTest com cobertura
        working-directory: blockchain/backend
        env:
          # Variáveis de ambiente mockadas para os testes
          FABRIC_MSP_ID: Org1MSP
          FABRIC_CHANNEL: mychannel
          FABRIC_CHAINCODE: hashverification
          FABRIC_ORDERER_ENDPOINT: localhost:7050
          FABRIC_PEER_ENDPOINT: localhost:7051
          FABRIC_PEER2_ENDPOINT: localhost:9051
          FABRIC_SAMPLES_DIR: /tmp/fabric-samples
          FABRIC_CERT_PATH: /tmp/cert
          FABRIC_KEY_PATH: /tmp/key
          FABRIC_TLS_CERT_PATH: /tmp/tls.crt
          API_KEY: test-api-key-secret
        run: |
          pytest tests/ \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            -v \
            --junitxml=test-results.xml

      - name: Upload — Relatório de Cobertura (Codecov)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: blockchain/backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload — Resultados dos testes (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: |
            blockchain/backend/test-results.xml
            blockchain/backend/coverage.xml
          retention-days: 30

      - name: Publicar resumo de testes no PR
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: blockchain/backend/test-results.xml
          github_token: ${{ secrets.GITHUB_TOKEN }} 

  # ─────────────────────────────────────────────────────────────
  # JOB 3 Lint & Build do Frontend (React + TypeScript)
  # ─────────────────────────────────────────────────────────────
  test-frontend:
    name: 🎨 Lint & Build — Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências npm
        working-directory: frontend
        run: npm ci

      - name: ESLint — Análise estática TypeScript/React
        working-directory: frontend
        run: npx eslint src --max-warnings=0 || true

      - name: TypeScript — Verificação de tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite Build — Compilar para produção
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Upload — Artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4 Docker Build & Push (Backend)
  # ─────────────────────────────────────────────────────────────
  #docker-build:
    name: 🐳 Docker — Build & Push Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-plataforma)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: blockchain/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload — Relatório de segurança Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─────────────────────────────────────────────────────────────
  # JOB 5 Deploy para Staging (branch: develop)
  # ─────────────────────────────────────────────────────────────
  #deploy-staging:
    name: 🚀 Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.fintechblock.example.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy no servidor de Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/fintechblock
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose pull backend
            docker compose up -d backend
            docker compose ps
            echo "✅ Staging atualizado: $IMAGE_TAG"

      - name: Health Check — Staging
        run: |
          sleep 10
          curl -f https://staging-api.fintechblock.example.com/health \
            -H "x-api-key: ${{ secrets.STAGING_API_KEY }}" \
            || (echo "❌ Health check falhou!" && exit 1)

  # ─────────────────────────────────────────────────────────────
  # JOB 6 Deploy para Produção (branch: main, aprovação manual)
  # ─────────────────────────────────────────────────────────────
  #deploy-production:
    name: 🏭 Deploy — Produção
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://fintechblock.example.com

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy em Produção via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/fintechblock
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker compose ps
            echo "🚀 Produção atualizada: $IMAGE_TAG"

      - name: Health Check — Produção
        run: |
          sleep 15
          curl -f https://api.fintechblock.example.com/health \
            -H "x-api-key: ${{ secrets.PROD_API_KEY }}" \
            || (echo "❌ Health check em Produção falhou!" && exit 1)

      - name: Notificação de Deploy — Sucesso
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ *Deploy em Produção concluído!*\n*Commit:* `${{ github.sha }}`\n*Autor:* ${{ github.actor }}\n*Branch:* `${{ github.ref_name }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notificação de Deploy — Falha
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ *Falha no Deploy em Produção!*\n*Commit:* `${{ github.sha }}`\n*Autor:* ${{ github.actor }}\nVerifique os logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
